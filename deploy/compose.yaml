# Private Linux server layout. Exactly ONE worker: the DB lease and file lock refuse a second worker,
# but do not scale it. The API is published only on the host's loopback (127.0.0.1:8765) and reached
# through `tailscale serve` (HTTPS, private tailnet). Nothing listens on the public internet.
name: orbit
services:
  worker:
    image: orbit-trading-lab
    command: ["python", "-m", "orbit.worker"]
    env_file: [/etc/orbit/orbit.env]       # chmod 600 root:root; never committed
    volumes: ["/srv/orbit/data:/data"]
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 45s                 # worker finishes its cycle, records shutdown, releases its lease
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 0.5
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
  api:
    image: orbit-trading-lab
    command: ["python", "-m", "orbit.api"]
    env_file: [/etc/orbit/orbit.env]
    environment:
      ORBIT_BIND_HOST: 0.0.0.0             # inside the container only; published on host loopback below
      ORBIT_DEPLOYMENT_MODE: remote        # requires ORBIT_PUBLIC_ORIGIN=https://... in orbit.env
    ports: ["127.0.0.1:8765:8765"]
    volumes: ["/srv/orbit/data:/data"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
