[project]
name = "orbit-trading-lab"
version = "0.1.0"
description = "Orbit Trading Lab - paper-only SPY research and supervised paper execution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.156.1",
  "uvicorn==0.54.0",
  "sqlalchemy==2.0.43",
  "pydantic==2.11.9",
  "pydantic-settings==2.11.0",
  "alpaca-py==0.44.0",
  "httpx==0.28.1",
  "argon2-cffi==25.1.0",
  "exchange-calendars==4.11.1",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
news = [
    "torch==2.15.0",
    "transformers==5.22.2",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pip-audit==2.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit"]
